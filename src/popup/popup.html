<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>🌊 textSurf</title>
    <style>
      html,
      body {
        margin: 0;
      }
      body {
        min-width: 240px;
        padding: 12px 14px;
        background: #111827;
        color: #f9fafb;
        font: 600 12px/1.3 ui-sans-serif, system-ui, -apple-system, sans-serif;
        letter-spacing: 0.01em;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 12px;
        font-weight: 600;
        color: #9ca3af;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 10px 8px 14px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        background: #1f2937;
        cursor: pointer;
      }
      .row span {
        white-space: nowrap;
      }
      input {
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
      }
      .switch {
        flex-shrink: 0;
        width: 36px;
        height: 20px;
        border-radius: 999px;
        background: #374151;
        position: relative;
        transition: background 0.15s ease;
      }
      .switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #f9fafb;
        transition: transform 0.15s ease;
      }
      input:checked + .switch {
        background: #38bdf8;
      }
      input:checked + .switch::after {
        transform: translateX(16px);
      }
      input:focus-visible + .switch {
        outline: 2px solid #38bdf8;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <h1>textSurf</h1>
    <label class="row">
      <span>open tabs in background</span>
      <input id="background" type="checkbox" />
      <span class="switch" aria-hidden="true"></span>
    </label>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
